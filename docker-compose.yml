services:
  nte-cafe:
    build: .
    image: nte-cafe:latest
    container_name: nte-cafe
    restart: unless-stopped
    ports:
      - "18423:80"
    environment:
      - PORT=80
      - NTE_CAFE_CONFIG=/app/config/config.json
    volumes:
      - nte-cafe-config:/app/config

volumes:
  nte-cafe-config:
