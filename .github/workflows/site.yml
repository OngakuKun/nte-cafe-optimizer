name: Generate and publish website

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Keep docs/ on dev as the generated template/preview.
      - name: Generate docs/ from the current app
        run: node scripts/build-site.mjs

      - name: Commit generated docs on dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate website template [skip ci]"
          git push

      # GitHub Pages serves the dedicated gh-pages branch from its root. The
      # site files are generated from the same source and pushed as a normal
      # (non-force) commit so the branch keeps a linear history.
      - name: Publish site to gh-pages
        env:
          SITE_OUT: ${{ runner.temp }}/nte-cafe-site
        run: |
          node scripts/build-site.mjs
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rf --quiet .
          cp -a "$SITE_OUT"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
            exit 0
          fi
          git commit -m "chore: publish generated website [skip ci]"
          git push origin gh-pages
