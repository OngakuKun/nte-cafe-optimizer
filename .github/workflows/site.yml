name: Generate website from app

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate docs/ from the current app
        run: node scripts/build-site.mjs

      # GitHub Pages publishes dev:/docs. Committing the generated files back
      # triggers a new Pages build; pushes made with GITHUB_TOKEN do not
      # re-trigger this workflow, and [skip ci] is a second safety net.
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date"
            exit 0
          fi
          git commit -m "chore: regenerate website from app [skip ci]"
          git push
