<!doctype html>
<html lang="en" data-theme="macchiato">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTE Cafe - Status</title>
  <script src="/webui.js"></script>
  <link rel="stylesheet" href="/ui/shared.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
    .value { font-size: 18px; font-weight: 700; margin-top: 8px; word-break: break-word; }
    .section { margin-top: 22px; }
    .section h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel-alt); }
    tr:last-child td { border-bottom: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--code); }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span>NTE Cafe</span> Optimizer</h1>
      <div class="sub">Backend status and loaded data</div>
    </div>
    <nav aria-label="Primary">
      <a class="nav-link" href="/">Optimizer</a>
      <a class="nav-link active" href="/status">Status</a>
    </nav>
    <div class="header-right">
      <div class="pill" id="status">Loading...</div>
      <div class="settings-wrap">
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94 7.43 7.43 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
        </button>
        <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings">
          <div class="settings-title">Settings</div>
          <div class="settings-row">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect" class="theme-select" aria-label="Color theme"></select>
            <button id="importThemeBtn" class="theme-btn" type="button">Import Theme</button>
            <input id="importThemeFile" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid">
      <div class="card"><div class="label">App</div><div class="value" id="appName">-</div></div>
      <div class="card"><div class="label">WebUI Version</div><div class="value" id="webuiVersion">-</div></div>
      <div class="card"><div class="label">Dishes Loaded</div><div class="value" id="dishCount">-</div></div>
      <div class="card"><div class="label">Characters Loaded</div><div class="value" id="charCount">-</div></div>
    </div>
    <div id="error" class="err"></div>

    <section class="section">
      <h2>Dishes</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Price L1</th><th>Price L2</th><th>Ingredients</th></tr></thead>
        <tbody id="dishBody"></tbody>
      </table></div>
    </section>

    <section class="section">
      <h2>Characters</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Name</th><th>Skills</th><th>Skill Details</th></tr></thead>
        <tbody id="charBody"></tbody>
      </table></div>
    </section>
  </main>

  <script src="/ui/theme.js"></script>
  <script>
    function esc(s) {
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
    }
    function fmtSkill(s) {
      const val = s.type.includes('mult') ? (s.value * 100).toFixed(2) + '%' : s.value.toFixed(2);
      const tag = s.tag && s.tag !== 'none' ? ' [' + s.tag + ']' : '';
      return `L${s.level} ${s.type} ${val}${tag} (req ${s.req})`;
    }
    async function load() {
      const err = document.getElementById('error');
      const status = document.getElementById('status');
      try {
        for (let i = 0; i < 50 && typeof getAppInfo !== 'function'; i++) await new Promise(r => setTimeout(r, 100));
        if (typeof getAppInfo !== 'function') throw new Error('WebUI backend bindings are not available. Open through nte-cafe-app server.');
        const [infoRaw, dishesRaw, charsRaw] = await Promise.all([getAppInfo(), getDishes(), getCharacters()]);
        const info = JSON.parse(infoRaw), dishes = JSON.parse(dishesRaw), chars = JSON.parse(charsRaw);
        document.getElementById('appName').textContent = info.app || '-';
        document.getElementById('webuiVersion').textContent = info.webui || '-';
        document.getElementById('dishCount').textContent = info.dishCount ?? dishes.length;
        document.getElementById('charCount').textContent = info.characterCount ?? chars.length;
        status.textContent = 'Connected'; status.classList.remove('error');
        document.getElementById('dishBody').innerHTML = dishes.map((d, i) => `<tr><td>${i+1}</td><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td>${Number(d.priceL1).toFixed(2)}</td><td>${Number(d.priceL2).toFixed(2)}</td><td>${d.ingredients}</td></tr>`).join('');
        document.getElementById('charBody').innerHTML = chars.map((c, i) => `<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${c.skillCount}</td><td><code>${esc((c.skills||[]).map(fmtSkill).join('; '))}</code></td></tr>`).join('');
      } catch (e) {
        status.textContent = 'Error'; status.classList.add('error');
        err.textContent = String(e && e.stack ? e.stack : e);
      }
    }
    window.addEventListener('DOMContentLoaded', () => { NteTheme.initTheme(); load(); });
  </script>
</body>
</html>
