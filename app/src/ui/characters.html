<!doctype html>
<html lang="en" data-theme="macchiato">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTE Cafe - Characters</title>
  <script src="/webui.js"></script>
  <link rel="stylesheet" href="/ui/shared.css">
  <style>
    .toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar .muted { color: var(--muted); font-size: 13px; }
    .save-state { font-size: 13px; color: var(--muted); }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap:14px; }
    .char-card {
      position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 2px var(--shadow); transition: border-color .15s ease, transform .15s ease;
      min-height: 280px;
    }
    .char-card:hover { border-color: var(--ctp-surface2); }
    .char-card:not(.owned) .avatar-wrap { filter: grayscale(.35) brightness(.75); }
    .avatar-wrap {
      position: absolute; inset: 0; background: linear-gradient(180deg, var(--ctp-surface0), var(--panel-alt));
    }
    .avatar-wrap img { width:100%; height:100%; object-fit: cover; object-position: center top; display:block; }
    .avatar-fallback {
      width:100%; height:100%; display:flex; align-items:center; justify-content:center;
      font-size: 52px; font-weight: 700; color: var(--accent); background: linear-gradient(160deg, var(--ctp-surface1), var(--ctp-mantle));
    }
    .overlay {
      position:absolute; inset:0;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--ctp-base) 96%, transparent) 0%,
        color-mix(in srgb, var(--ctp-base) 88%, transparent) 34%,
        color-mix(in srgb, var(--ctp-base) 45%, transparent) 62%,
        color-mix(in srgb, var(--ctp-base) 12%, transparent) 100%);
    }
    .owned-badge {
      position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; padding:4px 8px; border-radius:999px; z-index:2;
      background: color-mix(in srgb, var(--good) 20%, var(--panel)); color: var(--good); border:1px solid color-mix(in srgb, var(--good) 35%, transparent);
    }
    .char-card:not(.owned) .owned-badge { background: color-mix(in srgb, var(--muted) 18%, var(--panel)); color: var(--muted); border-color: transparent; }
    .body { position:relative; z-index:1; padding: 20px; max-width: 62%; min-height: 280px; display:flex; flex-direction:column; justify-content:flex-end; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .body { max-width: 78%; } }
    .name { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .controls { display:flex; gap:10px; align-items:center; margin-bottom: 12px; flex-wrap:wrap; }
    .toggle { display:inline-flex; gap:8px; align-items:center; font-size: 13px; color: var(--muted); }
    .toggle input { width:18px; height:18px; accent-color: var(--accent); }
    .level { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font: inherit; }
    .level:disabled { opacity: .5; }
    .skills { display:flex; flex-wrap:wrap; gap:6px; }
    .skill {
      font-size: 11px; line-height: 1; padding: 5px 7px; border-radius: 999px;
      background: var(--ctp-surface0); color: var(--subtext1, var(--ctp-subtext1)); border: 1px solid transparent;
    }
    .skill.price { color: var(--ctp-yellow); }
    .skill.traffic { color: var(--ctp-sky); }
    .skill.mult { border-color: color-mix(in srgb, currentColor 25%, transparent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span>NTE Cafe</span> Optimizer</h1>
      <div class="sub">Character ownership and levels</div>
    </div>
    <nav aria-label="Primary">
      <a class="nav-link" href="/">Optimizer</a>
      <a class="nav-link active" href="/characters">Characters</a>
      <a class="nav-link" href="/status">Status</a>
    </nav>
    <div class="header-right">
      <div class="pill" id="status">Loading...</div>
      <div class="settings-wrap">
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.43 7.43 0 0 0-.05.94 7.43 7.43 0 0 0 .05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
        </button>
        <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings">
          <div class="settings-title">Settings</div>
          <div class="settings-row">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect" class="theme-select" aria-label="Color theme"></select>
            <button id="importThemeBtn" class="theme-btn" type="button">Import Theme</button>
            <input id="importThemeFile" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <span class="muted">Set ownership and level for each character. Changes are saved automatically.</span>
      <span id="saveState" class="save-state"></span>
    </div>
    <div id="error" class="err"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script src="/ui/theme.js"></script>
  <script>
    const AVATAR_URLS = {
      'Nanally':  'https://static.wikia.nocookie.net/neverness-to-everness/images/8/8b/Nanally_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629174651',
      'Sakiri':   'https://nte.perfectworld.com/public/images/main260402/role-poster-zaowu.jpg',
      'Skia':     'https://static.wikia.nocookie.net/neverness-to-everness/images/0/0d/Skia_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629174906',
      'Baicang':  'https://static.wikia.nocookie.net/neverness-to-everness/images/8/83/Baicang_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629173726',
      'Mint':     'https://static.wikia.nocookie.net/neverness-to-everness/images/4/41/Mint_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629174611',
      'Haniel':   'https://static.wikia.nocookie.net/neverness-to-everness/images/a/a5/Haniel_Portrait.png/revision/latest/scale-to-width-down/419?cb=20260701202324',
      'Adler':    'https://static.wikia.nocookie.net/neverness-to-everness/images/0/0c/Adler_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629173120',
      'Dafodil':  'https://static.wikia.nocookie.net/neverness-to-everness/images/f/f0/Daffodill_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629173935',
      'Edgar':    'https://static.wikia.nocookie.net/neverness-to-everness/images/b/b4/Edgar_Portrait.png/revision/latest/scale-to-width-down/415?cb=20260701201907',
      'Aurelia':  'https://static.wikia.nocookie.net/neverness-to-everness/images/2/22/Aurelia_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629174756',
      'Chiz':     'https://static.wikia.nocookie.net/neverness-to-everness/images/4/42/Chiz_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260629173843',
      'Lacrimosa':'https://static.wikia.nocookie.net/neverness-to-everness/images/c/c1/Lacrimosa_Portrait.png/revision/latest/scale-to-width-down/403?cb=20260701202053',
      'Shinku':   'https://static.wikia.nocookie.net/neverness-to-everness/images/a/a8/Shinku_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260708083848',
      'Iroi':     'https://static.wikia.nocookie.net/neverness-to-everness/images/8/85/Iroi_Portrait.png/revision/latest/scale-to-width-down/422?cb=20260723021205',
      'Linko':    'https://static.wikia.nocookie.net/neverness-to-everness/images/e/ef/Linko_Portrait.png/revision/latest/scale-to-width-down/342?cb=20260817144327',
      'Akane Rin':'https://static.wikia.nocookie.net/neverness-to-everness/images/4/4f/Akane_Rin_Portrait.png/revision/latest/scale-to-width-down/317?cb=20260824145412',
    };

    function esc(s) { return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;"); }
    function avatarUrl(name) { return AVATAR_URLS[name] || ''; }
    function initials(name) { return String(name).split(/\s+/).filter(Boolean).slice(0,2).map(p=>p.charAt(0).toUpperCase()).join(''); }
    function fmtSkill(s) {
      const val = s.type.includes('mult') ? (s.value * 100).toFixed(2)+'%' : '+' + s.value.toFixed(2);
      const kind = s.type.includes('price') ? 'price' : 'traffic';
      const mult = s.type.includes('mult') ? 'mult' : '';
      const label = (s.type.includes('price') ? 'Price ' : 'Traffic ') + val;
      return `<span class="skill ${kind} ${mult}">L${s.level} ${esc(label)}</span>`;
    }
    function setSave(msg, err) { const el = document.getElementById('saveState'); el.textContent = msg; el.style.color = err ? 'var(--error)' : 'var(--muted)'; }
    async function saveRow(index, owned, level) {
      setSave('Saving...');
      try {
        const obj = JSON.parse(await setCharacterState(index, owned, level));
        if (!obj.ok) throw new Error(obj.error || 'Save failed');
        setSave('Saved');
      } catch (e) { setSave('Save failed', true); document.getElementById('error').textContent = String(e.message || e); }
    }
    function render(chars) {
      document.getElementById('grid').innerHTML = chars.map((c, i) => {
        const url = avatarUrl(c.name);
        const img = url
          ? `<img src="${esc(url)}" alt="${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'avatar-fallback\\'>${esc(initials(c.name))}</div>'">`
          : `<div class="avatar-fallback">${esc(initials(c.name))}</div>`;
        return `
          <article class="char-card ${c.owned ? 'owned' : ''}" data-card="${i}">
            <div class="avatar-wrap">${img}</div>
            <div class="overlay"></div>
            <div class="owned-badge">${c.owned ? 'Owned' : 'Not owned'}</div>
            <div class="body">
              <h2 class="name">${esc(c.name)}</h2>
              <div class="controls">
                <label class="toggle"><input type="checkbox" data-i="${i}" data-k="owned" ${c.owned?'checked':''}> Owned</label>
                <select class="level" data-i="${i}" data-k="level" ${c.owned?'':'disabled'} aria-label="Level for ${esc(c.name)}">
                  ${[1,2,3,4,5].map(l => `<option value="${l}" ${Number(c.level)===l?'selected':''}>Lv ${l}</option>`).join('')}
                </select>
              </div>
              <div class="skills">${(c.skills||[]).map(fmtSkill).join('')}</div>
            </div>
          </article>`;
      }).join('');

      document.querySelectorAll('[data-k="owned"]').forEach(el => el.addEventListener('change', async (e) => {
        const i = Number(e.target.dataset.i); const owned = e.target.checked;
        const card = document.querySelector(`[data-card="${i}"]`);
        card.classList.toggle('owned', owned);
        card.querySelector('.owned-badge').textContent = owned ? 'Owned' : 'Not owned';
        const levelSel = card.querySelector('select[data-k="level"]'); levelSel.disabled = !owned;
        await saveRow(i, owned, Number(levelSel.value));
      }));
      document.querySelectorAll('[data-k="level"]').forEach(el => el.addEventListener('change', async (e) => {
        const i = Number(e.target.dataset.i);
        const owned = document.querySelector(`input[data-i="${i}"][data-k="owned"]`).checked;
        await saveRow(i, owned, Number(e.target.value));
      }));
    }
    async function load() {
      const status = document.getElementById('status');
      try {
        for (let i=0; i<50 && typeof getCharacterStates !== 'function'; i++) await new Promise(r=>setTimeout(r,100));
        if (typeof getCharacterStates !== 'function') throw new Error('WebUI backend bindings unavailable. Open through nte-cafe-app server.');
        render(JSON.parse(await getCharacterStates()));
        status.textContent = 'Connected'; status.classList.remove('error');
      } catch (e) {
        status.textContent = 'Error'; status.classList.add('error');
        document.getElementById('error').textContent = String(e.message || e);
      }
    }
    window.addEventListener('DOMContentLoaded', () => { NteTheme.initTheme(); load(); });
  </script>
</body>
</html>
