<!doctype html>
<html lang="en" data-theme="macchiato">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTE Cafe - Dishes</title>
  <script src="/webui.js"></script>
  <link rel="stylesheet" href="/ui/shared.css">
  <style>
    .toolbar { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar .muted { color: var(--muted); font-size: 13px; }
    .save-state { font-size: 13px; color: var(--muted); }
    .grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:14px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .body { max-width: 72%; } }
    .dish-card {
      position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: visible;
      box-shadow: 0 1px 2px var(--shadow); transition: border-color .15s ease; min-height: 220px; cursor: pointer;
    }
    .dish-card:hover { border-color: var(--ctp-surface2); }
    .dish-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dish-card:not(.owned) .avatar-wrap { filter: grayscale(.35) brightness(.75); }
    .avatar-wrap {
      position:absolute; top:0; right:0; bottom:0; left:42%;
      background: transparent; border-radius: 0 14px 14px 0; overflow:hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 100%);
    }
    .avatar-wrap img { width:100%; height:100%; object-fit: contain; object-position: center right; display:block; padding: 14px; }
    .avatar-fallback {
      width:100%; height:100%; display:flex; align-items:center; justify-content:center;
      font-size: 48px; font-weight: 700; color: var(--accent); background: linear-gradient(160deg, var(--ctp-surface1), var(--ctp-mantle));
    }
    .overlay {
      position:absolute; inset:0; border-radius:14px; pointer-events:none;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--ctp-base) 98%, transparent) 0%,
        color-mix(in srgb, var(--ctp-base) 96%, transparent) 35%,
        color-mix(in srgb, var(--ctp-base) 74%, transparent) 52%,
        color-mix(in srgb, var(--ctp-base) 30%, transparent) 72%,
        color-mix(in srgb, var(--ctp-base) 8%, transparent) 100%);
    }
    .owned-badge {
      position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; padding:4px 8px; border-radius:999px; z-index:2;
      background: color-mix(in srgb, var(--good) 20%, var(--panel)); color: var(--good); border:1px solid color-mix(in srgb, var(--good) 35%, transparent);
    }
    .dish-card:not(.owned) .owned-badge { background: color-mix(in srgb, var(--muted) 18%, var(--panel)); color: var(--muted); border-color: transparent; }
    .body { position:relative; z-index:1; padding:16px; max-width:62%; min-height:220px; display:flex; flex-direction:column; justify-content:space-between; }
    .name { font-size:20px; font-weight:700; margin:0; line-height:1.2; }
    .prices { font-size:13px; color: var(--muted); margin-top:6px; }
    .tags { display:flex; flex-direction:column; align-items:flex-start; gap:6px; max-width: calc(100% - 96px); }
    .tag { font-size:11px; line-height:1; padding:5px 7px; border-radius:999px; background: var(--ctp-surface0); color: var(--subtext1, var(--ctp-subtext1)); }
    .tag.type-Beverages { color: var(--ctp-sky); }
    .tag.type-Desserts { color: var(--ctp-pink); }
    .tag.type-MainDishes { color: var(--ctp-peach); }
    .controls { position:absolute; right:16px; bottom:16px; z-index:3; display:flex; gap:8px; align-items:center; }
    .level-label { font-size: 13px; color: var(--muted); }
    .level-picker { position: relative; }
    .level-btn { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; min-width: 64px; }
    .level-btn:hover:not(:disabled) { border-color: var(--accent); }
    .level-btn:disabled { opacity: .5; cursor: default; }
    .level-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .level-menu { display:none; position:absolute; bottom: calc(100% + 6px); right:0; min-width: 100%; background: var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow: 0 8px 24px var(--shadow); z-index: 10; }
    .level-menu.open { display:block; }
    .level-option { display:block; width:100%; text-align:left; background:none; color:var(--text); border:0; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; white-space:nowrap; }
    .level-option:hover, .level-option.selected { background: var(--ctp-surface0); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span>NTE Cafe</span> Optimizer</h1>
      <div class="sub">Dish ownership and levels</div>
    </div>
    <nav aria-label="Primary">
      <a class="nav-link" href="/">Optimizer</a>
      <a class="nav-link" href="/characters">Characters</a>
      <a class="nav-link active" href="/dishes">Dishes</a>
      <a class="nav-link" href="/status">Status</a>
    </nav>
    <div class="header-right">
      <div class="pill" id="status">Loading...</div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <span class="muted">Set ownership and level for each dish. Changes are saved automatically.</span>
      <span id="saveState" class="save-state"></span>
    </div>
    <div id="error" class="err"></div>
    <div id="grid" class="grid"></div>
  </main>

  <script src="/ui/theme.js"></script>
  <script>
    const DISH_IMAGES = {
      'Coconut Latte': 'https://static.wikia.nocookie.net/neverness-to-everness/images/2/27/Item_Coconut_Latte.png/revision/latest?cb=20261111041647',
      'Ice Mocha': 'https://static.wikia.nocookie.net/neverness-to-everness/images/8/84/Item_Iced_Mocha.png/revision/latest?cb=20261111041712',
      'Apple Pie': 'https://static.wikia.nocookie.net/neverness-to-everness/images/d/dc/Item_Apple_Pie.png/revision/latest?cb=20261111041147',
      'Tomato & Fried Egg': 'https://static.wikia.nocookie.net/neverness-to-everness/images/e/ec/Item_Tomato_%26_Fried_Eggs_Croissant.png/revision/latest?cb=20261111041153',
      'Tuna Sandwich': 'https://static.wikia.nocookie.net/neverness-to-everness/images/d/da/Item_Tuna_Sandwich.png/revision/latest?cb=20261111041511',
      'Amber Glamor': 'https://static.wikia.nocookie.net/neverness-to-everness/images/5/5e/Item_Amber_Glamor.png/revision/latest?cb=20261111041238',
      'Matacha Lava Mousse': 'https://static.wikia.nocookie.net/neverness-to-everness/images/9/93/Item_Matcha_Lava_Mousse.png/revision/latest?cb=20261111042019',
      'Snowy Latte': 'https://static.wikia.nocookie.net/neverness-to-everness/images/5/55/Item_Snowy_Latte.png/revision/latest?cb=20261111041255',
      'Thick-Cut Fresh Beef Sandwich': 'https://static.wikia.nocookie.net/neverness-to-everness/images/c/ca/Item_Thick-Cut_Fresh_Beef_Sandwich.png/revision/latest?cb=20261111041334',
      'Red Bean & Butter Crossiant': 'https://static.wikia.nocookie.net/neverness-to-everness/images/d/d1/Item_Red_Bean_%26_Butter_Croissant.png/revision/latest?cb=20261111041341',
      'Strawberry Box Cake': 'https://static.wikia.nocookie.net/neverness-to-everness/images/3/30/Item_Strawberry_Box_Cake.png/revision/latest?cb=20261111041346',
      'Orange Hot Coffee': 'https://static.wikia.nocookie.net/neverness-to-everness/images/b/be/Item_Orange_Hot_Coffee.png/revision/latest?cb=20261111041352',
      'Pork Cutlet': 'https://static.wikia.nocookie.net/neverness-to-everness/images/d/d9/Item_Pork_Cutlet_Sandwich.png/revision/latest?cb=20261111041358',
      'Coconut Macchiato': 'https://static.wikia.nocookie.net/neverness-to-everness/images/f/f1/Item_Coconut_Macchiato.png/revision/latest?cb=20261111041949',
      'Matcha Latte with Milk Cap': 'https://static.wikia.nocookie.net/neverness-to-everness/images/2/25/Item_Matcha_Latte_with_Milk_Cap.png/revision/latest?cb=20261111041943',
      'Tiramisu': 'https://static.wikia.nocookie.net/neverness-to-everness/images/1/12/Item_Tiramisu_%28Origen%29.png/revision/latest?cb=20261111041930',
      'Ham & Cheese': 'https://static.wikia.nocookie.net/neverness-to-everness/images/d/de/Item_Ham_%26_Cheese_Croissant.png/revision/latest?cb=20261111041443',
      'Caramel & Cocoa Mille-Feuille': 'https://static.wikia.nocookie.net/neverness-to-everness/images/6/6a/Item_Caramel_%26_Cocoa_Mille-Feuille.png/revision/latest?cb=20261111041925'
    };

    function esc(s) { return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;"); }
    function initials(name) { return String(name).split(/\s+/).filter(Boolean).slice(0,2).map(p=>p.charAt(0).toUpperCase()).join(''); }
    function typeClass(t) { return 'type-' + String(t).replace(/\s+/g,''); }
    function setSave(msg, err) { const el = document.getElementById('saveState'); el.textContent = msg; el.style.color = err ? 'var(--error)' : 'var(--muted)'; }
    async function saveRow(index, owned, level) {
      setSave('Saving...');
      try {
        const obj = JSON.parse(await setDishState(index, owned, level));
        if (!obj.ok) throw new Error(obj.error || 'Save failed');
        setSave('Saved');
      } catch (e) { setSave('Save failed', true); document.getElementById('error').textContent = String(e.message || e); }
    }

    function render(dishes) {
      document.getElementById('grid').innerHTML = dishes.map((d, i) => {
        const url = DISH_IMAGES[d.name] || '';
        const img = url
          ? `<img src="${esc(url)}" alt="${esc(d.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'avatar-fallback\\'>${esc(initials(d.name))}</div>'">`
          : `<div class="avatar-fallback">${esc(initials(d.name))}</div>`;
        const ings = Array.isArray(d.ingredients) ? d.ingredients : [];
        const tags = [`<span class="tag ${typeClass(d.type)}">${esc(d.type)}</span>`, ...ings.map(x => `<span class="tag">${esc(x)}</span>`)].join('');
        return `
          <article class="dish-card ${d.owned ? 'owned' : ''}" data-card="${i}" data-i="${i}" role="button" tabindex="0" aria-pressed="${d.owned ? 'true' : 'false'}" aria-label="Toggle ${esc(d.name)} owned">
            <div class="avatar-wrap">${img}</div>
            <div class="overlay"></div>
            <div class="owned-badge">${d.owned ? 'Owned' : 'Not owned'}</div>
            <div class="body">
              <div>
                <h2 class="name">${esc(d.name)}</h2>
                <div class="prices">L1 ${Number(d.priceL1).toFixed(2)} · L2 ${Number(d.priceL2).toFixed(2)}</div>
              </div>
              <div class="tags">${tags}</div>
            </div>
            <div class="controls">
              <span class="level-label">Level</span>
              <div class="level-picker" data-i="${i}">
                <button type="button" class="level-btn" data-i="${i}" ${d.owned?'':'disabled'} aria-haspopup="listbox" aria-expanded="false">Lv ${Number(d.level)||1}</button>
                <div class="level-menu" role="listbox" aria-label="Level for ${esc(d.name)}">
                  ${[1,2].map(l => `<button type="button" class="level-option ${Number(d.level)===l?'selected':''}" data-i="${i}" data-level="${l}" role="option">Lv ${l}</button>`).join('')}
                </div>
              </div>
            </div>
          </article>`;
      }).join('');

      const closeMenus = () => document.querySelectorAll('.level-menu.open').forEach(m => { m.classList.remove('open'); m.previousElementSibling?.setAttribute('aria-expanded','false'); });
      document.addEventListener('click', closeMenus);

      document.querySelectorAll('[data-card]').forEach(card => {
        const toggle = async () => {
          const i = Number(card.dataset.i);
          const owned = !card.classList.contains('owned');
          card.classList.toggle('owned', owned);
          card.setAttribute('aria-pressed', owned ? 'true' : 'false');
          card.querySelector('.owned-badge').textContent = owned ? 'Owned' : 'Not owned';
          const levelBtn = card.querySelector('.level-btn');
          levelBtn.disabled = !owned;
          await saveRow(i, owned, Number(levelBtn.textContent.replace(/\D/g,'')) || 1);
        };
        card.addEventListener('click', (e) => { if (e.target.closest('.controls')) return; toggle(); });
        card.addEventListener('keydown', (e) => {
          if (e.target.closest('.controls')) return;
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
      });

      document.querySelectorAll('.level-picker').forEach(picker => {
        const btn = picker.querySelector('.level-btn');
        const menu = picker.querySelector('.level-menu');
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (btn.disabled) return;
          const open = menu.classList.contains('open');
          closeMenus();
          if (!open) { menu.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
        });
        picker.querySelectorAll('.level-option').forEach(opt => opt.addEventListener('click', async (e) => {
          e.stopPropagation();
          const i = Number(opt.dataset.i);
          const level = Number(opt.dataset.level);
          const card = document.querySelector(`[data-card="${i}"]`);
          btn.textContent = `Lv ${level}`;
          picker.querySelectorAll('.level-option').forEach(o => o.classList.toggle('selected', o === opt));
          closeMenus();
          await saveRow(i, card.classList.contains('owned'), level);
        }));
      });
    }

    async function load() {
      const status = document.getElementById('status');
      try {
        for (let i=0; i<50 && typeof getDishStates !== 'function'; i++) await new Promise(r=>setTimeout(r,100));
        if (typeof getDishStates !== 'function') throw new Error('WebUI backend bindings unavailable. Open through nte-cafe-app server.');
        render(JSON.parse(await getDishStates()));
        status.textContent = 'Connected'; status.classList.remove('error');
      } catch (e) {
        status.textContent = 'Error'; status.classList.add('error');
        document.getElementById('error').textContent = String(e.message || e);
      }
    }
    window.addEventListener('DOMContentLoaded', () => { NteTheme.initTheme(); load(); });
  </script>
</body>
</html>
