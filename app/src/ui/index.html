<!doctype html>
<html lang="en" data-theme="macchiato">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTE Cafe - Optimizer</title>
  <script src="/webui.js"></script>
  <link rel="stylesheet" href="/ui/shared.css">
  <style>
    .placeholder {
      margin-top: 24px; padding: 48px 24px; text-align: center;
      background: var(--panel); border: 1px dashed var(--border); border-radius: 12px;
    }
    .placeholder h2 { margin: 0 0 10px; font-size: 22px; }
    .placeholder p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span>NTE Cafe</span> Optimizer</h1>
      <div class="sub">Roster optimization workspace</div>
    </div>
    <nav aria-label="Primary">
      <a class="nav-link active" href="/">Optimizer</a>
      <a class="nav-link" href="/status">Status</a>
    </nav>
    <div class="header-right">
      <label class="label" for="themeSelect" style="margin:0">Theme</label>
      <select id="themeSelect" class="theme-select" aria-label="Color theme"></select>
      <button id="importThemeBtn" class="theme-btn" type="button">Import Theme</button>
      <input id="importThemeFile" type="file" accept=".json,application/json" hidden>
      <div class="pill" id="status">Ready</div>
    </div>
  </header>

  <main>
    <div id="error" class="err"></div>
    <section class="placeholder">
      <h2>Optimizer UI coming next</h2>
      <p>This will be the main optimizer page. Use <a href="/status" style="color:var(--accent)">Status</a> for backend/data diagnostics.</p>
    </section>
  </main>

  <script src="/ui/theme.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      NteTheme.initTheme();
      const status = document.getElementById('status');
      status.textContent = 'Ready';
      status.classList.remove('error');
    });
  </script>
</body>
</html>
